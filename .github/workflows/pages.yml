name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7,12 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update prices and scores
        env:
          ARTIFICIAL_INTELLIGENCE_API_KEY: ${{ secrets.ARTIFICIAL_INTELLIGENCE_API_KEY }}
        run: |
          node scripts/update-pricing.mjs
          if [ -n "$ARTIFICIAL_INTELLIGENCE_API_KEY" ]; then
            node scripts/update-scores.mjs
          else
            echo "Artificial Analysis key not configured; publishing existing scores."
          fi
          node -e "require('fs').writeFileSync('data/refresh-meta.json', JSON.stringify({ pricesCheckedAt: new Date().toISOString(), scoresChecked: !!process.env.ARTIFICIAL_INTELLIGENCE_API_KEY }) + '\n')"
      - name: Prepare public files
        run: |
          mkdir public
          cp ./*.html ./*.js ./*.css public/
          cp -r data public/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
